name = "fireflyenergy-website"
compatibility_date = "2024-09-23"
# Tiny Worker that adds Range support for the hero videos (iOS Safari needs it); see worker.js.
main = "worker.js"

# Workers Builds (git-connected) and `wrangler deploy` both run this first. The Astro site
# lives in site/ and its output (site/dist) isn't committed, so without a build step every
# git-triggered deploy failed. PUBLIC_SUPABASE_URL and PUBLIC_GA_ID are public (they ship in the page anyway).
[build]
command = "cd site && npm ci && PUBLIC_SUPABASE_URL=https://tlsidpnhpirasfrhxfkz.supabase.co PUBLIC_GA_ID=G-9J8DG3FW7Y npm run build"

[assets]
directory = "./site/dist"
binding = "ASSETS"
run_worker_first = ["/assets/video/*"]
