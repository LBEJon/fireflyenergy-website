<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefly System Flow Component</title>
    <style>
        /* Base typography and variables needed for the component */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --firefly-green: #A4D233;
            --firefly-dark: #7AB800;
            --nordic-charcoal: #3A3D42;
            --nordic-blue: #00A8E1;
            --solar-gold: #FFB81C;
            --alert-red: #FF4A4A;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
            --card-bg: rgba(26, 28, 32, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-glow: rgba(164, 210, 51, 0.15);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            /* Deeper dark background */
            background-image: radial-gradient(circle at center, rgba(164, 210, 51, 0.03) 0%, transparent 70%);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .flow-diagram-card {
            position: relative;
            background: rgba(20, 22, 26, 0.85);
            /* Glassier background */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* Subtle edge highlight */
            border-radius: 20px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                /* Deeper shadow */
                0 10px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.1),
                /* Crisper inner bevel */
                inset 0 0 40px rgba(0, 0, 0, 0.5);
            /* Inner vignette */
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            z-index: 1;
        }

        /* Subtle ambient glow behind the card */
        .flow-diagram-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(164, 210, 51, 0.3), rgba(0, 168, 225, 0.1), transparent 60%);
            z-index: -1;
            border-radius: 22px;
            filter: blur(15px);
            opacity: 0.5;
        }

        .flow-diagram-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 32px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.4), transparent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Glowing line under header */
        .flow-diagram-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 30%;
            height: 1px;
            background: linear-gradient(90deg, var(--firefly-green), transparent);
            box-shadow: 0 0 10px var(--firefly-green);
        }

        .flow-diagram-header img {
            height: 72px;
            /* Much larger logo */
            width: auto;
            /* Invert to pure white for dark background, add stronger green glow */
            filter: brightness(0) invert(1) drop-shadow(0 0 16px rgba(164, 210, 51, 0.8));
        }

        .flow-diagram-header .flow-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            /* Bolder */
            font-size: 20px;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            /* Text depth */
        }

        .flow-diagram-header .flow-title span {
            color: var(--firefly-green);
            text-shadow: 0 0 15px rgba(164, 210, 51, 0.4);
            /* Neon text glow */
        }

        .flow-diagram-area {
            padding: 24px 16px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Custom scrollbar for horizontal scrolling area */
        .flow-diagram-area::-webkit-scrollbar {
            height: 6px;
        }

        .flow-diagram-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }

        .flow-diagram-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .flow-diagram-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .flow-svg {
            width: 100%;
            min-width: 860px;
            /* Forces scroll on mobile natively keeping layout intact */
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            /* Adds massive depth to the entire flow */
        }

        /* Pulse animation for active node glowing border */
        @keyframes borderPulse {
            0% {
                filter: drop-shadow(0 0 10px rgba(164, 210, 51, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 25px rgba(164, 210, 51, 0.6));
            }

            100% {
                filter: drop-shadow(0 0 10px rgba(164, 210, 51, 0.3));
            }
        }

        /* Node cards using SVG gradients */
        .fd-card {
            fill: url(#card-bg-gradient);
            /* Replaced solid fill with gradient */
            stroke: var(--card-border);
            stroke-width: 1.5;
            transition: fill 0.8s, stroke 0.8s, opacity 0.8s, filter 0.8s;
        }

        .fd-card.active {
            stroke: rgba(164, 210, 51, 0.8);
            stroke-width: 2;
            fill: url(#card-bg-gradient-active);
            animation: borderPulse 4s infinite ease-in-out;
        }

        .fd-card.dimmed {
            opacity: 0.2;
            stroke: rgba(255, 255, 255, 0.03);
            fill: url(#card-bg-gradient);
            filter: grayscale(100%) blur(1px);
        }

        .fd-card.optional {
            stroke-dasharray: 6 4;
            fill: url(#card-bg-gradient);
        }

        .fd-card.optional.active {
            stroke: rgba(255, 184, 28, 0.8);
            fill: url(#card-bg-gradient-solar);
            filter: drop-shadow(0 0 20px rgba(255, 184, 28, 0.25));
        }

        .fd-card.optional.dimmed {
            opacity: 0.15;
            filter: grayscale(100%) blur(1px);
        }

        .fd-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 11px;
            fill: rgba(255, 255, 255, 0.85);
            text-anchor: middle;
            transition: opacity 0.8s;
            letter-spacing: 0.5px;
        }

        .fd-dimmed-text {
            opacity: 0.25;
        }

        /* Flow paths */
        .fd-path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            /* Darker base so actives pop more */
            stroke-width: 5;
            /* Slightly thicker */
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s, opacity 0.8s, filter 0.8s, stroke-width 0.8s;
        }

        /* Flow Path glow animations */
        @keyframes pathFlow {
            0% {
                stroke-dashoffset: 40;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        .fd-path.active {
            stroke: #A4D233;
            stroke-width: 6;
            /* Expand when active */
            filter: drop-shadow(0 0 12px rgba(164, 210, 51, 0.8)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            stroke-dasharray: 10 10;
            /* Dashed flowing effect */
            animation: pathFlow 1s linear infinite;
        }

        .fd-path.active-solar {
            stroke: #FFB81C;
            stroke-width: 6;
            filter: drop-shadow(0 0 12px rgba(255, 184, 28, 0.8)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            stroke-dasharray: 10 10;
            animation: pathFlow 1s linear infinite;
        }

        .fd-path.active-grid {
            stroke: #00A8E1;
            stroke-width: 6;
            filter: drop-shadow(0 0 12px rgba(0, 168, 225, 0.8)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            stroke-dasharray: 10 10;
            animation: pathFlow 1s linear infinite;
        }

        .fd-path.active-battery {
            stroke: #A4D233;
            stroke-width: 6;
            filter: drop-shadow(0 0 12px rgba(164, 210, 51, 0.8)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            stroke-dasharray: 10 10;
            animation: pathFlow 1s linear infinite;
        }

        .fd-path.dimmed {
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 3;
            opacity: 0.2;
            stroke-dasharray: none;
            animation: none;
        }

        .fd-path.cut {
            stroke: #D03030;
            stroke-dasharray: 8 6;
            stroke-width: 3;
            opacity: 0.5;
            filter: drop-shadow(0 0 8px rgba(208, 48, 48, 0.6));
            animation: none;
        }

        /* Particles */
        .fd-particle {
            opacity: 0;
            transition: opacity 0.5s;
        }

        .fd-particle.visible {
            opacity: 1;
        }

        /* Upgraded particles rendering */
        .fd-particle-core {
            r: 4;
        }

        .fd-particle-halo {
            r: 10;
            opacity: 0.6;
        }

        .fd-particle.solar .fd-particle-core {
            fill: #FFF9E6;
            filter: drop-shadow(0 0 2px #fff);
        }

        .fd-particle.solar .fd-particle-halo {
            fill: #FFCF5F;
            filter: url(#fd-glow-gold);
        }

        .fd-particle.grid .fd-particle-core {
            fill: #E6F7FF;
            filter: drop-shadow(0 0 2px #fff);
        }

        .fd-particle.grid .fd-particle-halo {
            fill: #66CFFF;
            filter: url(#fd-glow-blue);
        }

        .fd-particle.green .fd-particle-core,
        .fd-particle.battery .fd-particle-core {
            fill: #F4FCE1;
            filter: drop-shadow(0 0 2px #fff);
        }

        .fd-particle.green .fd-particle-halo,
        .fd-particle.battery .fd-particle-halo {
            fill: #A4D233;
            filter: url(#fd-glow-green);
        }

        /* Outage X */
        .fd-outage-x {
            stroke: #FF4A4A;
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0;
            transition: opacity 0.8s;
            filter: drop-shadow(0 0 8px rgba(255, 74, 74, 0.6));
        }

        .fd-outage-x.show {
            opacity: 0.9;
        }

        /* State banner */
        .flow-state-banner {
            text-align: center;
            padding: 16px 0 14px;
            transition: background 0.8s;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 8px;
        }

        .flow-state-banner .flow-state-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 4px;
            transition: color 0.8s, text-shadow 0.8s;
        }

        .flow-state-banner .flow-state-desc {
            font-family: 'Open Sans', sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .flow-state-banner.state-normal {
            background: linear-gradient(90deg, rgba(164, 210, 51, 0.08), rgba(0, 168, 225, 0.04));
        }

        .flow-state-banner.state-normal .flow-state-title {
            color: #A4D233;
            text-shadow: 0 0 12px rgba(164, 210, 51, 0.3);
        }

        .flow-state-banner.state-outage {
            background: linear-gradient(90deg, rgba(255, 74, 74, 0.08), rgba(255, 184, 28, 0.08));
        }

        .flow-state-banner.state-outage .flow-state-title {
            color: #FFB81C;
            text-shadow: 0 0 12px rgba(255, 184, 28, 0.3);
        }

        .flow-state-banner.state-backup {
            background: linear-gradient(90deg, rgba(164, 210, 51, 0.1), rgba(164, 210, 51, 0.04));
        }

        .flow-state-banner.state-backup .flow-state-title {
            color: #A4D233;
            text-shadow: 0 0 12px rgba(164, 210, 51, 0.3);
        }

        .flow-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding-bottom: 24px;
        }

        .flow-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.4s, transform 0.4s, box-shadow 0.4s;
        }

        .flow-dot.on {
            background: #A4D233;
            transform: scale(1.4);
            box-shadow: 0 0 8px rgba(164, 210, 51, 0.6);
        }
    </style>
</head>

<body>

    <div class="flow-diagram-card">
        <div class="flow-diagram-header">
            <img src="firefly_logo_transparent.png" alt="Firefly">
            <span class="flow-title">HOW THE FIREFLY CONTINUOUS POWER <span>SYSTEM</span> WORKS</span>
        </div>
        <div class="flow-diagram-area">
            <svg class="flow-svg" viewBox="0 0 960 470">
                <defs>
                    /* Deep realistic inner shadow for 3D cards */
                    <filter id="card-inner-shadow" x="-5%" y="-5%" width="110%" height="110%">
                        <feComponentTransfer in="SourceAlpha">
                            <feFuncA type="linear" slope="0.6" />
                        </feComponentTransfer>
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feOffset dx="0" dy="4" />
                        <feComposite operator="out" in2="SourceAlpha" />
                        <feComposite operator="in" in2="SourceGraphic" />
                        <feBlend mode="multiply" in2="SourceGraphic" />
                    </filter>

                    <!-- Rich glassy gradients for nodes -->
                    <linearGradient id="card-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(40, 44, 52, 0.4)" />
                        <stop offset="100%" stop-color="rgba(15, 17, 20, 0.8)" />
                    </linearGradient>

                    <linearGradient id="card-bg-gradient-active" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(164, 210, 51, 0.15)" />
                        <stop offset="50%" stop-color="rgba(40, 44, 52, 0.4)" />
                        <stop offset="100%" stop-color="rgba(15, 17, 20, 0.8)" />
                    </linearGradient>

                    <linearGradient id="card-bg-gradient-solar" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255, 184, 28, 0.15)" />
                        <stop offset="50%" stop-color="rgba(40, 44, 52, 0.4)" />
                        <stop offset="100%" stop-color="rgba(15, 17, 20, 0.8)" />
                    </linearGradient>

                    <radialGradient id="inverter-glow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="rgba(164,210,51,0.25)" />
                        <stop offset="60%" stop-color="rgba(164,210,51,0.05)" />
                        <stop offset="100%" stop-color="transparent" />
                    </radialGradient>

                    <filter id="fd-glow-gold">
                        <feGaussianBlur stdDeviation="5" result="b" />
                        <feMerge>
                            <feMergeNode in="b" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="fd-glow-blue">
                        <feGaussianBlur stdDeviation="5" result="b" />
                        <feMerge>
                            <feMergeNode in="b" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="fd-glow-green">
                        <feGaussianBlur stdDeviation="6" result="b" />
                        <feMerge>
                            <feMergeNode in="b" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="fd-shadow" x="-10%" y="-10%" width="120%" height="130%">
                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
                        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
                    </filter>
                    <clipPath id="fd-bat-clip">
                        <rect x="652" y="283" width="88" height="100" rx="8" />
                    </clipPath>
                </defs>

                <!-- FLOW PATHS -->
                <path id="fp-solar-inv" class="fd-path" d="M 265,100 C 330,100 360,185 385,185" />
                <path id="fp-grid-inv" class="fd-path" d="M 265,330 C 330,330 360,240 385,240" />
                <path id="fp-inv-house" class="fd-path" d="M 600,200 C 650,200 680,155 720,155" />
                <path id="fp-inv-bat" class="fd-path" d="M 530,285 C 530,330 600,350 645,350" />
                <path id="fp-bat-inv" class="fd-path" d="M 645,330 C 600,330 530,310 530,265" />

                <!-- PARTICLES (Moved below paths, above nodes for z-index) -->
                <g class="fd-particle solar" id="fps1">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2.5s" repeatCount="indefinite">
                        <mpath href="#fp-solar-inv" />
                    </animateMotion>
                </g>
                <g class="fd-particle solar" id="fps2">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.83s">
                        <mpath href="#fp-solar-inv" />
                    </animateMotion>
                </g>
                <g class="fd-particle solar" id="fps3">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1.66s">
                        <mpath href="#fp-solar-inv" />
                    </animateMotion>
                </g>

                <g class="fd-particle grid" id="fpg1">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite">
                        <mpath href="#fp-grid-inv" />
                    </animateMotion>
                </g>
                <g class="fd-particle grid" id="fpg2">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite" begin="0.66s">
                        <mpath href="#fp-grid-inv" />
                    </animateMotion>
                </g>
                <g class="fd-particle grid" id="fpg3">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite" begin="1.33s">
                        <mpath href="#fp-grid-inv" />
                    </animateMotion>
                </g>

                <g class="fd-particle green" id="fph1">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="1.8s" repeatCount="indefinite">
                        <mpath href="#fp-inv-house" />
                    </animateMotion>
                </g>
                <g class="fd-particle green" id="fph2">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="1.8s" repeatCount="indefinite" begin="0.6s">
                        <mpath href="#fp-inv-house" />
                    </animateMotion>
                </g>
                <g class="fd-particle green" id="fph3">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.2s">
                        <mpath href="#fp-inv-house" />
                    </animateMotion>
                </g>

                <g class="fd-particle battery" id="fpc1">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite">
                        <mpath href="#fp-inv-bat" />
                    </animateMotion>
                </g>
                <g class="fd-particle battery" id="fpc2">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite" begin="1s">
                        <mpath href="#fp-inv-bat" />
                    </animateMotion>
                </g>

                <g class="fd-particle battery" id="fpd1">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite">
                        <mpath href="#fp-bat-inv" />
                    </animateMotion>
                </g>
                <g class="fd-particle battery" id="fpd2">
                    <circle class="fd-particle-halo" cx="0" cy="0" />
                    <circle class="fd-particle-core" cx="0" cy="0" />
                    <animateMotion dur="2s" repeatCount="indefinite" begin="1s">
                        <mpath href="#fp-bat-inv" />
                    </animateMotion>
                </g>

                <!-- SOLAR PANELS (Optional) -->
                <g id="fd-solar">
                    <rect class="fd-card optional active" x="48" y="42" width="218" height="120" rx="14"
                        filter="url(#fd-shadow)" />
                    <rect x="168" y="46" width="90" height="20" rx="10" fill="#FFCF5F" opacity="0.15" />
                    <text font-family="Montserrat" font-weight="600" font-size="8" fill="#FFCF5F" text-anchor="middle"
                        x="213" y="59" letter-spacing="1">OPTIONAL</text>
                    <circle cx="115" cy="93" r="20" fill="#FFB81C" opacity="0.85" />
                    <g stroke="#FFB81C" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
                        <line x1="115" y1="65" x2="115" y2="58" />
                        <line x1="115" y1="121" x2="115" y2="128" />
                        <line x1="87" y1="93" x2="80" y2="93" />
                        <line x1="143" y1="93" x2="150" y2="93" />
                        <line x1="97" y1="75" x2="92" y2="70" />
                        <line x1="133" y1="75" x2="138" y2="70" />
                        <line x1="97" y1="111" x2="92" y2="116" />
                        <line x1="133" y1="111" x2="138" y2="116" />
                    </g>
                    <rect x="173" y="77" width="56" height="36" rx="3" fill="none" stroke="#D09010" stroke-width="2"
                        opacity="0.65" />
                    <line x1="192" y1="77" x2="192" y2="113" stroke="#D09010" stroke-width="1" opacity="0.35" />
                    <line x1="210" y1="77" x2="210" y2="113" stroke="#D09010" stroke-width="1" opacity="0.35" />
                    <line x1="173" y1="95" x2="229" y2="95" stroke="#D09010" stroke-width="1" opacity="0.35" />
                    <line x1="201" y1="113" x2="201" y2="122" stroke="#D09010" stroke-width="2" opacity="0.4" />
                    <line x1="190" y1="122" x2="212" y2="122" stroke="#D09010" stroke-width="2" opacity="0.4" />
                    <text class="fd-label" x="157" y="150">SOLAR PANELS</text>
                </g>

                <!-- POWER GRID -->
                <g id="fd-grid">

    <script>
        (function () {
            const FD_STATES = [
                {
                    key: 'normal', cls: 'state-normal', title: 'NORMAL OPERATION',
                    desc: 'Solar and grid power your home while charging the battery',
                    solarOn: true, gridOn: true, houseOn: true, chargingOn: true, dischargingOn: false, outage: false,
                    pathSolar: 'active-solar', pathGrid: 'active-grid', pathHouse: 'active',
                    pathInvBat: 'active-battery', pathBatInv: 'dimmed', bat: 'charging'
                },
                {
                    key: 'outage', cls: 'state-outage', title: 'POWER OUTAGE',
                    desc: 'Grid goes down — battery instantly takes over, life continues uninterrupted',
                    solarOn: true, gridOn: false, houseOn: true, chargingOn: false, dischargingOn: true, outage: true,
                    pathSolar: 'active-solar', pathGrid: 'cut', pathHouse: 'active',
                    pathInvBat: 'dimmed', pathBatInv: 'active-battery', bat: 'discharging'
                },
                {
                    key: 'backup', cls: 'state-backup', title: 'FULL BATTERY BACKUP',
                    desc: 'No sun, no grid — stored energy keeps everything running through the night',
                    solarOn: false, gridOn: false, houseOn: true, chargingOn: false, dischargingOn: true, outage: true,
                    pathSolar: 'dimmed', pathGrid: 'cut', pathHouse: 'active',
                    pathInvBat: 'dimmed', pathBatInv: 'active-battery', bat: 'discharging'
                }
            ];

            let fdCur = 0, fdBatFrame = 0;

            function fdApply(idx) {
                const s = FD_STATES[idx];
                const banner = document.getElementById('flow-banner');
                if (!banner) return;
                banner.className = 'flow-state-banner ' + s.cls;
                document.getElementById('flow-title').textContent = s.title;
                document.getElementById('flow-desc').textContent = s.desc;
                for (let i = 0; i < 3; i++) document.getElementById('fd' + i).className = 'flow-dot' + (i === idx ? ' on' : '');

                document.getElementById('fp-solar-inv').className.baseVal = 'fd-path ' + s.pathSolar;
                document.getElementById('fp-grid-inv').className.baseVal = 'fd-path ' + s.pathGrid;
                document.getElementById('fp-inv-house').className.baseVal = 'fd-path ' + s.pathHouse;

                const fpInvBat = document.getElementById('fp-inv-bat');
                fpInvBat.className.baseVal = 'fd-path ' + s.pathInvBat;
                if (s.bat === 'charging') fpInvBat.classList.add('charging');
                else fpInvBat.classList.remove('charging');

                const fpBatInv = document.getElementById('fp-bat-inv');
                fpBatInv.className.baseVal = 'fd-path ' + s.pathBatInv;
                if (s.bat === 'charging') fpBatInv.classList.add('charging');
                else fpBatInv.classList.remove('charging');

                // Toggle ambient glow based on state
                const glow = document.querySelector('.fd-ambient-glow');
                if (glow) {
                    if (s.outage) {
                        glow.setAttribute('fill', 'url(#inverter-glow-outage)'); // fallback to standard if not defined, but you can define more radial gradients
                        glow.style.opacity = 0.5;
                    } else {
                        glow.setAttribute('fill', 'url(#inverter-glow)');
                        glow.style.opacity = 1;
                    }
                }

                ['fps1', 'fps2', 'fps3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.solarOn));
                ['fpg1', 'fpg2', 'fpg3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.gridOn));
                ['fph1', 'fph2', 'fph3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.houseOn));
                ['fpc1', 'fpc2'].forEach(id => document.getElementById(id).classList.toggle('visible', s.chargingOn));
                ['fpd1', 'fpd2'].forEach(id => document.getElementById(id).classList.toggle('visible', s.dischargingOn));

                const sc = document.querySelector('#fd-solar .fd-card');
                sc.className.baseVal = 'fd-card optional ' + (s.solarOn ? 'active' : 'dimmed');
                document.querySelector('#fd-solar .fd-label').classList.toggle('fd-dimmed-text', !s.solarOn);

                document.querySelector('#fd-grid .fd-card').className.baseVal = 'fd-card ' + (s.gridOn ? 'active' : 'dimmed');
                document.querySelector('#fd-grid .fd-label').classList.toggle('fd-dimmed-text', !s.gridOn);

                document.getElementById('fd-x1').classList.toggle('show', s.outage);
                document.getElementById('fd-x2').classList.toggle('show', s.outage);

                document.querySelectorAll('.fd-win-glow').forEach(w => {
                    w.setAttribute('opacity', s.houseOn ? (w.dataset.baseOp || '0.25') : '0.02');
                });

                document.querySelectorAll('#fd-solar line, #fd-solar circle, #fd-solar rect:not(.fd-card)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.solarOn ? '' : '0.12';
                });
                document.querySelectorAll('#fd-solar text:not(.fd-label)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.solarOn ? '' : '0.2';
                });
                document.querySelectorAll('#fd-grid line:not(.fd-outage-x), #fd-grid rect:not(.fd-card), #fd-grid text:not(.fd-label)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.gridOn ? '' : '0.12';
                });
            }

            function fdAnimBat() {
                const bars = ['fb1', 'fb2', 'fb3', 'fb4'];
                const s = FD_STATES[fdCur];
                if (s.bat === 'charging') {
                    const fill = fdBatFrame % 5;
                    bars.forEach((id, i) => document.getElementById(id).setAttribute('opacity', i < fill ? '0.85' : '0.1'));
                } else {
                    const keep = 4 - (fdBatFrame % 4);
                    bars.forEach((id, i) => document.getElementById(id).setAttribute('opacity', i < keep ? '0.85' : '0.06'));
                }
                fdBatFrame++;
            }

            document.querySelectorAll('.fd-win-glow').forEach(w => { w.dataset.baseOp = w.getAttribute('opacity'); });
            fdApply(0);
            setInterval(fdAnimBat, 700);
            setInterval(function () { fdCur = (fdCur + 1) % FD_STATES.length; fdBatFrame = 0; fdApply(fdCur); }, 5000);
        })();
    </script>
