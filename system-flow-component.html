<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefly System Flow Component</title>
    <style>
        /* Base typography and variables needed for the component */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');
        
        :root {
            --firefly-green: #A4D233;
            --firefly-dark: #7AB800;
            --nordic-charcoal: #3A3D42;
            --nordic-blue: #00A8E1;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0A0A0A; /* Dark background to showcase the glassmorphism card */
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .flow-diagram-card {
            background: #1A1C20;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25), 0 4px 16px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            max-width: 100%;
            margin: 0 auto;
        }

        .flow-diagram-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 24px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .flow-diagram-header img {
            height: 40px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .flow-diagram-header .flow-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 1px;
        }

        .flow-diagram-header .flow-title span {
            color: var(--firefly-green);
        }

        .flow-diagram-area {
            padding: 24px 16px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Custom scrollbar for horizontal scrolling area */
        .flow-diagram-area::-webkit-scrollbar {
            height: 6px;
        }

        .flow-diagram-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }

        .flow-diagram-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .flow-diagram-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .flow-svg {
            width: 100%;
            min-width: 860px;
            /* Forces scroll on mobile natively keeping layout intact */
            height: auto;
            display: block;
        }

        /* Node cards */
        .fd-card {
            fill: rgba(255, 255, 255, 0.02);
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 1.5;
            transition: fill 0.8s, stroke 0.8s, opacity 0.8s, filter 0.8s;
        }

        .fd-card.active {
            stroke: rgba(164, 210, 51, 0.5);
            stroke-width: 2;
            fill: rgba(164, 210, 51, 0.04);
            filter: drop-shadow(0 0 15px rgba(164, 210, 51, 0.1));
        }

        .fd-card.dimmed {
            opacity: 0.3;
            stroke: rgba(255, 255, 255, 0.04);
            fill: rgba(255, 255, 255, 0.01);
        }

        .fd-card.optional {
            stroke-dasharray: 6 4;
        }

        .fd-card.optional.active {
            stroke: rgba(255, 184, 28, 0.5);
            fill: rgba(255, 184, 28, 0.04);
            filter: drop-shadow(0 0 15px rgba(255, 184, 28, 0.15));
        }

        .fd-card.optional.dimmed {
            opacity: 0.2;
        }

        .fd-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 11px;
            fill: rgba(255, 255, 255, 0.85);
            text-anchor: middle;
            transition: opacity 0.8s;
            letter-spacing: 0.5px;
        }

        .fd-dimmed-text {
            opacity: 0.25;
        }

        /* Flow paths */
        .fd-path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke 0.8s, opacity 0.8s, filter 0.8s;
        }

        .fd-path.active {
            stroke: #A4D233;
            filter: drop-shadow(0 0 8px rgba(164, 210, 51, 0.5));
        }

        .fd-path.active-solar {
            stroke: #FFB81C;
            filter: drop-shadow(0 0 8px rgba(255, 184, 28, 0.6));
        }

        .fd-path.active-grid {
            stroke: #00A8E1;
            filter: drop-shadow(0 0 8px rgba(0, 168, 225, 0.6));
        }

        .fd-path.active-battery {
            stroke: #A4D233;
            filter: drop-shadow(0 0 8px rgba(164, 210, 51, 0.5));
        }

        .fd-path.dimmed {
            stroke: rgba(255, 255, 255, 0.04);
            opacity: 0.3;
        }

        .fd-path.cut {
            stroke: #D03030;
            stroke-dasharray: 8 6;
            opacity: 0.6;
            filter: drop-shadow(0 0 6px rgba(208, 48, 48, 0.4));
        }

        /* Particles */
        .fd-particle {
            r: 6;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .fd-particle.visible {
            opacity: 1;
        }

        .fd-particle.solar {
            fill: #FFCF5F;
            filter: url(#fd-glow-gold);
        }

        .fd-particle.grid {
            fill: #66CFFF;
            filter: url(#fd-glow-blue);
        }

        .fd-particle.green {
            fill: #D8F88E;
            filter: url(#fd-glow-green);
        }

        .fd-particle.battery {
            fill: #D8F88E;
            filter: url(#fd-glow-green);
        }

        /* Outage X */
        .fd-outage-x {
            stroke: #FF4A4A;
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0;
            transition: opacity 0.8s;
            filter: drop-shadow(0 0 8px rgba(255, 74, 74, 0.6));
        }

        .fd-outage-x.show {
            opacity: 0.9;
        }

        /* State banner */
        .flow-state-banner {
            text-align: center;
            padding: 16px 0 14px;
            transition: background 0.8s;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 8px;
        }

        .flow-state-banner .flow-state-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 4px;
            transition: color 0.8s, text-shadow 0.8s;
        }

        .flow-state-banner .flow-state-desc {
            font-family: 'Open Sans', sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .flow-state-banner.state-normal {
            background: linear-gradient(90deg, rgba(164, 210, 51, 0.08), rgba(0, 168, 225, 0.04));
        }

        .flow-state-banner.state-normal .flow-state-title {
            color: #A4D233;
            text-shadow: 0 0 12px rgba(164, 210, 51, 0.3);
        }

        .flow-state-banner.state-outage {
            background: linear-gradient(90deg, rgba(255, 74, 74, 0.08), rgba(255, 184, 28, 0.08));
        }

        .flow-state-banner.state-outage .flow-state-title {
            color: #FFB81C;
            text-shadow: 0 0 12px rgba(255, 184, 28, 0.3);
        }

        .flow-state-banner.state-backup {
            background: linear-gradient(90deg, rgba(164, 210, 51, 0.1), rgba(164, 210, 51, 0.04));
        }

        .flow-state-banner.state-backup .flow-state-title {
            color: #A4D233;
            text-shadow: 0 0 12px rgba(164, 210, 51, 0.3);
        }

        .flow-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding-bottom: 24px;
        }

        .flow-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.4s, transform 0.4s, box-shadow 0.4s;
        }

        .flow-dot.on {
            background: #A4D233;
            transform: scale(1.4);
            box-shadow: 0 0 8px rgba(164, 210, 51, 0.6);
        }


    </style>
</head>

    <script>
        (function () {
            const FD_STATES = [
                {
                    key: 'normal', cls: 'state-normal', title: 'NORMAL OPERATION',
                    desc: 'Solar and grid power your home while charging the battery',
                    solarOn: true, gridOn: true, houseOn: true, chargingOn: true, dischargingOn: false, outage: false,
                    pathSolar: 'active-solar', pathGrid: 'active-grid', pathHouse: 'active',
                    pathInvBat: 'active-battery', pathBatInv: 'dimmed', bat: 'charging'
                },
                {
                    key: 'outage', cls: 'state-outage', title: 'POWER OUTAGE',
                    desc: 'Grid goes down — battery instantly takes over, life continues uninterrupted',
                    solarOn: true, gridOn: false, houseOn: true, chargingOn: false, dischargingOn: true, outage: true,
                    pathSolar: 'active-solar', pathGrid: 'cut', pathHouse: 'active',
                    pathInvBat: 'dimmed', pathBatInv: 'active-battery', bat: 'discharging'
                },
                {
                    key: 'backup', cls: 'state-backup', title: 'FULL BATTERY BACKUP',
                    desc: 'No sun, no grid — stored energy keeps everything running through the night',
                    solarOn: false, gridOn: false, houseOn: true, chargingOn: false, dischargingOn: true, outage: true,
                    pathSolar: 'dimmed', pathGrid: 'cut', pathHouse: 'active',
                    pathInvBat: 'dimmed', pathBatInv: 'active-battery', bat: 'discharging'
                }
            ];

            let fdCur = 0, fdBatFrame = 0;

            function fdApply(idx) {
                const s = FD_STATES[idx];
                const banner = document.getElementById('flow-banner');
                if (!banner) return;
                banner.className = 'flow-state-banner ' + s.cls;
                document.getElementById('flow-title').textContent = s.title;
                document.getElementById('flow-desc').textContent = s.desc;
                for (let i = 0; i < 3; i++) document.getElementById('fd' + i).className = 'flow-dot' + (i === idx ? ' on' : '');

                document.getElementById('fp-solar-inv').className.baseVal = 'fd-path ' + s.pathSolar;
                document.getElementById('fp-grid-inv').className.baseVal = 'fd-path ' + s.pathGrid;
                document.getElementById('fp-inv-house').className.baseVal = 'fd-path ' + s.pathHouse;
                document.getElementById('fp-inv-bat').className.baseVal = 'fd-path ' + s.pathInvBat;
                document.getElementById('fp-bat-inv').className.baseVal = 'fd-path ' + s.pathBatInv;

                ['fps1', 'fps2', 'fps3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.solarOn));
                ['fpg1', 'fpg2', 'fpg3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.gridOn));
                ['fph1', 'fph2', 'fph3'].forEach(id => document.getElementById(id).classList.toggle('visible', s.houseOn));
                ['fpc1', 'fpc2'].forEach(id => document.getElementById(id).classList.toggle('visible', s.chargingOn));
                ['fpd1', 'fpd2'].forEach(id => document.getElementById(id).classList.toggle('visible', s.dischargingOn));

                const sc = document.querySelector('#fd-solar .fd-card');
                sc.className.baseVal = 'fd-card optional ' + (s.solarOn ? 'active' : 'dimmed');
                document.querySelector('#fd-solar .fd-label').classList.toggle('fd-dimmed-text', !s.solarOn);

                document.querySelector('#fd-grid .fd-card').className.baseVal = 'fd-card ' + (s.gridOn ? 'active' : 'dimmed');
                document.querySelector('#fd-grid .fd-label').classList.toggle('fd-dimmed-text', !s.gridOn);

                document.getElementById('fd-x1').classList.toggle('show', s.outage);
                document.getElementById('fd-x2').classList.toggle('show', s.outage);

                document.querySelectorAll('.fd-win-glow').forEach(w => {
                    w.setAttribute('opacity', s.houseOn ? (w.dataset.baseOp || '0.25') : '0.02');
                });

                document.querySelectorAll('#fd-solar line, #fd-solar circle, #fd-solar rect:not(.fd-card)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.solarOn ? '' : '0.12';
                });
                document.querySelectorAll('#fd-solar text:not(.fd-label)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.solarOn ? '' : '0.2';
                });
                document.querySelectorAll('#fd-grid line:not(.fd-outage-x), #fd-grid rect:not(.fd-card), #fd-grid text:not(.fd-label)').forEach(el => {
                    el.style.transition = 'opacity 0.8s'; el.style.opacity = s.gridOn ? '' : '0.12';
                });
            }

            function fdAnimBat() {
                const bars = ['fb1', 'fb2', 'fb3', 'fb4'];
                const s = FD_STATES[fdCur];
                if (s.bat === 'charging') {
                    const fill = fdBatFrame % 5;
                    bars.forEach((id, i) => document.getElementById(id).setAttribute('opacity', i < fill ? '0.85' : '0.1'));
                } else {
                    const keep = 4 - (fdBatFrame % 4);
                    bars.forEach((id, i) => document.getElementById(id).setAttribute('opacity', i < keep ? '0.85' : '0.06'));
                }
                fdBatFrame++;
            }

            document.querySelectorAll('.fd-win-glow').forEach(w => { w.dataset.baseOp = w.getAttribute('opacity'); });
            fdApply(0);
            setInterval(fdAnimBat, 700);
            setInterval(function () { fdCur = (fdCur + 1) % FD_STATES.length; fdBatFrame = 0; fdApply(fdCur); }, 5000);
        })();
    </script>
